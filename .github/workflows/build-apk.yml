# Builds an installable APK of FitTracker Health on GitHub's servers.
# Push this folder to a GitHub repo, open the Actions tab, and download "FitTrackerHealth-apk".
name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Rename
        run: cp app/build/outputs/apk/debug/app-debug.apk FitTrackerHealth.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FitTrackerHealth-apk
          path: FitTrackerHealth.apk
